# Fly.io: https://fly.io/docs/reference/configuration/
# Имя приложения на Fly (уникально во всём Fly). Для другой копии бота — поменять здесь.
app = "twelve-weeks-astana"
primary_region = "fra"

# Бот получает сообщения через long polling, а Mini App (FastAPI) слушает порт 8080 —
# Fly отдаёт его наружу по HTTPS: https://twelve-weeks-astana.fly.dev (Telegram требует HTTPS).

kill_signal = "SIGINT"
kill_timeout = "10s"

[build]

[env]
  DATABASE_PATH = "/data/bot.db"
  TIMEZONE = "Asia/Almaty"  # Астана, UTC+5
  # Общий старт цикла сообщества — первый понедельник октября
  CYCLE_START = "2026-10-05"
  CHECKIN_DAY = "sun"
  CHECKIN_TIME = "18:00"
  PLANNING_TIME = "09:00"
  BACKUP_TIME = "03:00"
  PORT = "8080"
  # BOT_TOKEN и ADMIN_IDS — не здесь, а через `fly secrets set` (см. README)

[http_service]
  internal_port = 8080
  force_https = true
  # Машину НЕ усыплять без веб-трафика: в том же процессе работает бот (polling, расписание, бэкап)
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[mounts]]
  source = "bot_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  # 256 МБ мало: только aiogram при загрузке занимает ~160 МБ, весь бот — ~200 МБ,
  # и на 256 МБ процесс убивало «Out of memory». 512 МБ — с запасом.
  memory = "512mb"
