# Ручная выгрузка исходников образа с Fly в отдельную ветку (без выкатки) — чтобы сверить код,
# выкаченный на сервер мимо репозитория.
name: Export image source to a branch

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Образ на Fly (registry.fly.io/…)"
        required: true
      branch:
        description: "Ветка, куда положить исходники"
        default: "prod-image-0010"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Copy /app out of the image and push it as a branch
        run: |
          flyctl auth docker
          docker pull "${{ inputs.image }}"
          cid=$(docker create "${{ inputs.image }}")
          mkdir src && docker cp "$cid:/app/." src/ && docker rm "$cid"
          find src -name __pycache__ -type d -prune -exec rm -rf {} +
          cd src
          git init -q -b "${{ inputs.branch }}"
          git config user.name "image-export" && git config user.email "image-export@users.noreply.github.com"
          git add -A && git commit -q -m "Source of ${{ inputs.image }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "${{ inputs.branch }}"
